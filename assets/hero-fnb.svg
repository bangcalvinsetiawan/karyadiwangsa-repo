<svg width="440" height="380" viewBox="0 0 440 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ilustrasi: dapur komersial modern + elemen konsultasi (clipboard, growth chart) -->
  <defs>
    <linearGradient id="counterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="fnbAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Meja dapur/counter -->
  <rect x="40" y="240" width="360" height="16" rx="4" fill="#334155"/>
  <rect x="50" y="256" width="20" height="70" fill="#1E293B"/>
  <rect x="370" y="256" width="20" height="70" fill="#1E293B"/>
  <rect x="60" y="200" width="320" height="42" rx="6" fill="url(#counterGrad)"/>

  <!-- Kompor / stove top -->
  <g transform="translate(90,210)">
    <rect x="0" y="0" width="90" height="24" rx="6" fill="#1E293B"/>
    <circle cx="22" cy="12" r="8" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="22" cy="12" r="4" fill="#F97316" opacity="0.6"/>
    <circle cx="68" cy="12" r="8" fill="none" stroke="#F97316" stroke-width="2"/>
    <circle cx="68" cy="12" r="4" fill="#F97316" opacity="0.6"/>
  </g>

  <!-- Panci di atas kompor dengan uap -->
  <g transform="translate(100,178)">
    <ellipse cx="10" cy="24" rx="14" ry="4" fill="#94A3B8"/>
    <path d="M-4 24 L-4 12 Q-4 6 10 6 Q24 6 24 12 L24 24 Z" fill="#475569"/>
    <ellipse cx="10" cy="12" rx="14" ry="3" fill="#64748B"/>
    <path d="M2 -4 Q0 -12 4 -18" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M12 -4 Q10 -14 14 -20" stroke="#CBD5E1" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Talenan + pisau -->
  <g transform="translate(210,215)">
    <rect x="0" y="0" width="46" height="20" rx="4" fill="#D97706" opacity="0.85"/>
    <path d="M4 4 L36 4 L30 16 L10 16 Z" fill="#F1F5F9"/>
    <rect x="34" y="6" width="18" height="4" rx="2" fill="#94A3B8"/>
  </g>

  <!-- Rak dinding dgn peralatan -->
  <rect x="60" y="150" width="150" height="8" rx="2" fill="#1E293B"/>
  <rect x="70" y="120" width="8" height="30" rx="3" fill="#94A3B8"/>
  <circle cx="74" cy="118" r="10" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <rect x="95" y="128" width="6" height="22" rx="2" fill="#EF4444" opacity="0.7"/>
  <rect x="115" y="125" width="6" height="25" rx="2" fill="#94A3B8"/>

  <!-- Clipboard SOP (representasi konsultasi/sistem) -->
  <g transform="translate(280,90)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="white" stroke="#EF4444" stroke-width="2.5"/>
    <rect x="20" y="-6" width="30" height="12" rx="4" fill="#EF4444"/>
    <line x1="12" y1="24" x2="58" y2="24" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="38" x2="58" y2="38" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="52" x2="42" y2="52" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 66 L20 74 L36 58" stroke="#22C55E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Growth chart kecil (representasi analisa kelayakan bisnis) -->
  <g transform="translate(320,220)">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="white" opacity="0.95"/>
    <polyline points="8,38 22,26 36,32 50,14 62,8" stroke="url(#fnbAccent)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="62" cy="8" r="4" fill="#EF4444"/>
  </g>

  <!-- Chef hat dekoratif -->
  <g transform="translate(40,100)">
    <path d="M0 40 L0 55 L36 55 L36 40" fill="white" stroke="#EF4444" stroke-width="2"/>
    <path d="M-2 40 Q-2 15 18 15 Q38 15 38 40 Q38 32 18 32 Q-2 32 -2 40 Z" fill="white" stroke="#EF4444" stroke-width="2"/>
  </g>

  <!-- Partikel dekoratif -->
  <circle cx="400" cy="150" r="3" fill="#EF4444" opacity="0.3"/>
  <circle cx="30" cy="60" r="2.5" fill="#EF4444" opacity="0.3"/>
</svg>
