<svg width="440" height="380" viewBox="0 0 440 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ilustrasi: dashboard software + CCTV + akses kontrol + sensor IoT -->
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="itAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Monitor utama dgn dashboard ERP/CRM -->
  <g transform="translate(70,60)">
    <rect x="0" y="0" width="230" height="150" rx="10" fill="url(#screenGrad)"/>
    <rect x="0" y="0" width="230" height="150" rx="10" fill="none" stroke="#334155" stroke-width="2"/>
    <rect x="100" y="150" width="30" height="20" fill="#334155"/>
    <ellipse cx="115" cy="172" rx="50" ry="6" fill="#1E293B"/>

    <!-- Chart bar (dashboard analytics) -->
    <rect x="16" y="16" width="90" height="60" rx="6" fill="#0F172A" stroke="#334155"/>
    <rect x="24" y="55" width="10" height="16" rx="2" fill="#0EA5E9"/>
    <rect x="40" y="42" width="10" height="29" rx="2" fill="#38BDF8"/>
    <rect x="56" y="30" width="10" height="41" rx="2" fill="#7DD3FC"/>
    <rect x="72" y="48" width="10" height="23" rx="2" fill="#38BDF8"/>
    <rect x="88" y="36" width="10" height="35" rx="2" fill="#0EA5E9"/>

    <!-- Card stat -->
    <rect x="116" y="16" width="98" height="26" rx="6" fill="#0F172A" stroke="#334155"/>
    <circle cx="130" cy="29" r="6" fill="#38BDF8"/>
    <rect x="144" y="24" width="56" height="4" rx="2" fill="#64748B"/>
    <rect x="144" y="32" width="36" height="4" rx="2" fill="#334155"/>

    <rect x="116" y="50" width="98" height="26" rx="6" fill="#0F172A" stroke="#334155"/>
    <circle cx="130" cy="63" r="6" fill="#22C55E"/>
    <rect x="144" y="58" width="56" height="4" rx="2" fill="#64748B"/>
    <rect x="144" y="66" width="36" height="4" rx="2" fill="#334155"/>

    <!-- Table rows (CRM data) -->
    <rect x="16" y="88" width="198" height="10" rx="2" fill="#0F172A"/>
    <rect x="16" y="102" width="198" height="10" rx="2" fill="#0F172A" opacity="0.7"/>
    <rect x="16" y="116" width="198" height="10" rx="2" fill="#0F172A" opacity="0.5"/>
    <circle cx="24" cy="93" r="3" fill="#0EA5E9"/>
    <circle cx="24" cy="107" r="3" fill="#38BDF8"/>
    <circle cx="24" cy="121" r="3" fill="#7DD3FC"/>
  </g>

  <!-- CCTV Camera panel (kanan atas) -->
  <g transform="translate(320,40)">
    <rect x="0" y="0" width="90" height="65" rx="8" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.5"/>
    <rect x="8" y="8" width="74" height="40" rx="4" fill="#1E293B"/>
    <circle cx="45" cy="28" r="12" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="45" cy="28" r="5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="72" cy="14" r="3" fill="#EF4444"/>
    <rect x="8" y="52" width="30" height="4" rx="2" fill="#334155"/>
    <rect x="42" y="52" width="30" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- Kamera CCTV fisik -->
  <g transform="translate(340,120) rotate(15)">
    <rect x="0" y="0" width="46" height="20" rx="8" fill="#1E293B"/>
    <circle cx="40" cy="10" r="7" fill="#0EA5E9"/>
    <circle cx="40" cy="10" r="3" fill="#0F172A"/>
    <rect x="-6" y="6" width="10" height="8" rx="2" fill="#334155"/>
  </g>

  <!-- Akses kontrol / fingerprint panel -->
  <g transform="translate(70,240)">
    <rect x="0" y="0" width="70" height="90" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="14" y="14" width="42" height="30" rx="4" fill="#1E293B"/>
    <text x="35" y="34" font-size="10" fill="#38BDF8" text-anchor="middle" font-family="monospace">••••</text>
    <circle cx="35" cy="66" r="18" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <path d="M35 56 Q28 56 28 64 Q28 72 35 76 Q42 72 42 64 Q42 56 35 56" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
    <path d="M35 60 Q31 60 31 64 Q31 70 35 72" stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.7"/>
  </g>

  <!-- IoT sensor node + sinyal -->
  <g transform="translate(220,260)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#0EA5E9"/>
    <circle cx="17" cy="17" r="6" fill="white" opacity="0.9"/>
    <path d="M17 -6 A17 17 0 0 1 40 6" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M17 -14 A25 25 0 0 1 48 0" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Server rack kecil -->
  <g transform="translate(300,250)">
    <rect x="0" y="0" width="60" height="80" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <rect x="8" y="10" width="44" height="12" rx="2" fill="#0F172A"/>
    <circle cx="46" cy="16" r="2.5" fill="#22C55E"/>
    <rect x="8" y="28" width="44" height="12" rx="2" fill="#0F172A"/>
    <circle cx="46" cy="34" r="2.5" fill="#38BDF8"/>
    <rect x="8" y="46" width="44" height="12" rx="2" fill="#0F172A"/>
    <circle cx="46" cy="52" r="2.5" fill="#22C55E"/>
    <rect x="8" y="64" width="44" height="12" rx="2" fill="#0F172A"/>
    <circle cx="46" cy="70" r="2.5" fill="#F59E0B"/>
  </g>

  <!-- Garis koneksi antar elemen (representasi integrasi sistem) -->
  <g opacity="0.35" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M185 215 L105 240" fill="none"/>
    <path d="M240 210 L237 260" fill="none"/>
    <path d="M300 130 L330 250" fill="none"/>
  </g>
</svg>
