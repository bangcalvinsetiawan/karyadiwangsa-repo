<svg width="440" height="380" viewBox="0 0 440 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ilustrasi: proses aplikasi epoxy flooring di area pabrik/gudang -->
  <defs>
    <linearGradient id="epoxyShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="warehouseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Lantai epoxy mengkilap (perspektif isometrik) -->
  <path d="M40 280 L400 280 L360 340 L80 340 Z" fill="url(#epoxyShine)"/>
  <path d="M40 280 L400 280 L360 340 L80 340 Z" fill="white" opacity="0.08"/>
  <!-- garis reflektif lantai -->
  <path d="M100 285 L70 335" stroke="white" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
  <path d="M180 282 L150 338" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <path d="M260 282 L235 338" stroke="white" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <path d="M340 282 L320 335" stroke="white" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Area lantai beton belum dilapisi (kontras before/after) -->
  <path d="M40 280 L160 280 L140 320 L80 320 Z" fill="#94A3B8" opacity="0.5"/>
  <circle cx="90" cy="295" r="2" fill="#64748B" opacity="0.6"/>
  <circle cx="110" cy="305" r="1.5" fill="#64748B" opacity="0.6"/>
  <circle cx="100" cy="285" r="1.5" fill="#64748B" opacity="0.5"/>

  <!-- Dinding gudang belakang -->
  <rect x="40" y="120" width="360" height="160" fill="url(#warehouseGrad)"/>
  <rect x="70" y="150" width="60" height="80" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="70" y="150" width="60" height="80" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="70" y1="190" x2="130" y2="190" stroke="#475569" stroke-width="2"/>

  <rect x="240" y="150" width="60" height="80" rx="4" fill="#0F172A" opacity="0.6"/>
  <rect x="240" y="150" width="60" height="80" rx="4" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="270" y1="150" x2="270" y2="230" stroke="#475569" stroke-width="2"/>
  <line x1="240" y1="190" x2="300" y2="190" stroke="#475569" stroke-width="2"/>

  <!-- Kaleng/ember epoxy sedang dituang -->
  <g transform="translate(155,225)">
    <path d="M0 0 L-6 -22 L26 -22 L20 0 Z" fill="#94A3B8"/>
    <ellipse cx="10" cy="-22" rx="16" ry="4" fill="#CBD5E1"/>
    <path d="M-6 -22 Q-14 -30 -8 -36" stroke="#64748B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- cairan mengalir -->
    <path d="M2 0 Q0 20 -6 44 Q-10 56 4 60 Q18 56 14 44 Q10 24 14 0 Z" fill="url(#epoxyShine)"/>
  </g>

  <!-- Genangan hasil tuangan di lantai -->
  <ellipse cx="163" cy="298" rx="34" ry="10" fill="url(#epoxyShine)"/>
  <ellipse cx="163" cy="298" rx="34" ry="10" fill="white" opacity="0.15"/>

  <!-- Roller/alat perata epoxy -->
  <g transform="translate(240,300) rotate(-8)">
    <rect x="0" y="0" width="70" height="10" rx="5" fill="#F59E0B"/>
    <rect x="30" y="-32" width="5" height="34" fill="#1E293B"/>
    <rect x="24" y="-42" width="17" height="12" rx="3" fill="#334155"/>
  </g>

  <!-- Safety cone -->
  <g transform="translate(340,260)">
    <path d="M12 0 L24 50 L0 50 Z" fill="#F97316"/>
    <rect x="2" y="20" width="20" height="6" fill="white"/>
    <ellipse cx="12" cy="50" rx="16" ry="4" fill="#EA580C"/>
  </g>

  <!-- Partikel dekoratif -->
  <circle cx="380" cy="140" r="3" fill="#F59E0B" opacity="0.4"/>
  <circle cx="60" cy="150" r="2.5" fill="#F59E0B" opacity="0.3"/>
</svg>
